# AndroidX
android.useAndroidX=true
# Jetifier 已关闭：依赖全部为 AndroidX，无 support-library 迁移需求，
# 开启会为每个依赖做字节码改写拖慢构建
# Gradle JVM arguments
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AGP 8.2 要求 JDK 17（JBR 21 的 jlink 无法解析 SDK core-for-system-modules.jar 的 android 平台标记）
org.gradle.java.home=C:/Users/kongj/jdk-17.0.20+8
org.gradle.parallel=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# 修复 AAPT2 out-of-process 守护进程在 Windows 上启动失败（"Daemon startup failed"）
# daemon 模式改为进程内执行（in_process），绕过常驻 aapt2 守护进程（二进制本身已验证可独立运行）
android.aapt2DaemonMode=in_process
